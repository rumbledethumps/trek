name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Make the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir site
          gh release download --repo picocomputer/rp6502 --pattern '*-itch.io.zip' --output web.zip
          unzip -j web.zip rp6502.js rp6502.wasm -d site
          gh release download --repo picocomputer/msbasic --pattern basic.rp6502 --dir site
          cp index.html src/game.bas src/instructions.bas site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
